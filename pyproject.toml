[project]
name = "cortex-ascend"
version = "0.0.0"
description = "Evidence-driven assurance kernel for bounded AI software-engineering work."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.3",
    "hypothesis==6.165.10",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "tests/architecture/fixtures",
    "tests/docs/fixtures",
    "tests/static/fixtures",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cortex_ascend", "tools"]
exclude = "(^|/)tests/(architecture|docs|static)/fixtures/"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/property"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]
