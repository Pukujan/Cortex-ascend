name: check

# Qualification-grade CI for G0. GitHub Actions is part of the bootstrap TCB.
# Future AWS access must use GitHub OIDC (id-token: write + role-to-assume).
# Long-lived AWS keys are forbidden in this repository's workflows.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "0.12.5"
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          enable-cache: true
      - name: Verify CPython 3.12
        run: uv run --frozen python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - name: Qualify
        run: make check
